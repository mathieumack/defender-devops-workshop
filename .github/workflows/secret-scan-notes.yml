# ---------------------------------------------------------------------------
# .github/workflows/secret-scan-notes.yml — Secret Scanning Guidance
# ---------------------------------------------------------------------------
# GitHub secret scanning is a native GHAS feature that runs automatically
# when enabled. It does NOT require a workflow — GitHub scans every push.
#
# This workflow exists only as documentation and a CI reminder.
#
# To enable secret scanning:
#   1. Go to repo Settings → Code security → Secret scanning → Enable
#   2. Optionally enable "Push protection" to block pushes containing secrets
#
# In this demo repo, the dummy secret in app/server.py should trigger an
# alert in Security → Secret scanning alerts.
#
# Defender for Cloud DevOps connector surfaces secret scanning alerts
# alongside code and dependency findings in unified DevOps posture view.
# ---------------------------------------------------------------------------

name: "Secret Scanning Notes"

on:
  workflow_dispatch:

jobs:
  reminder:
    name: Secret Scanning Reminder
    runs-on: ubuntu-latest
    steps:
      - name: Secret scanning status
        run: |
          echo "============================================================"
          echo " SECRET SCANNING"
          echo "============================================================"
          echo ""
          echo " GitHub secret scanning is AUTOMATIC when enabled."
          echo " No workflow is needed — this job is for documentation only."
          echo ""
          echo " Ensure the following are enabled in repo settings:"
          echo "   - Code security → Secret scanning: ON"
          echo "   - Code security → Push protection: ON (recommended)"
          echo ""
          echo " Dummy secrets in this repo (all FAKE):"
          echo "   - app/server.py: STORAGE_ACCOUNT_KEY (Azure Storage format)"
          echo "   - container/Dockerfile: AZURE_STORAGE_KEY env var"
          echo ""
          echo " These should appear in:"
          echo "   - GitHub Security tab → Secret scanning alerts"
          echo "   - Defender for Cloud → DevOps security → Findings"
          echo "============================================================"
