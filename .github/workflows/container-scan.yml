# ---------------------------------------------------------------------------
# .github/workflows/container-scan.yml — Container Image Vulnerability Scan
# ---------------------------------------------------------------------------
# Builds the Docker image and scans it with Trivy for OS and library CVEs.
# Uploads SARIF results to the GitHub Security tab.
# Defender for Cloud can also scan images pushed to ACR (Defender for
# Containers), providing a second layer of visibility.
# ---------------------------------------------------------------------------

name: "Container Image Scan"

on:
  push:
    branches: [main]
    paths:
      - "container/**"
      - "app/**"
  pull_request:
    branches: [main]
    paths:
      - "container/**"
      - "app/**"
  workflow_dispatch:

permissions:
  security-events: write
  contents: read

jobs:
  build-and-scan:
    name: Build & Scan Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f container/Dockerfile -t demo-api:scan .

      - name: Run Trivy vulnerability scanner
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}:/workspace" \
            aquasec/trivy:latest image \
            --format sarif \
            --output /workspace/trivy-results.sarif \
            --severity CRITICAL,HIGH,MEDIUM \
            --exit-code 0 \
            demo-api:scan

      - name: Upload Trivy SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
          category: "container-scan"

      - name: Upload SARIF as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-sarif
          path: trivy-results.sarif
