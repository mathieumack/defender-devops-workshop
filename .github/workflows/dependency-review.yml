# ---------------------------------------------------------------------------
# .github/workflows/dependency-review.yml — Dependency Vulnerability Review
# ---------------------------------------------------------------------------
# Runs on pull requests to flag newly introduced vulnerable dependencies.
# Works with GitHub's dependency graph. Results appear as PR checks and in
# the Security tab → Dependabot alerts.
# ---------------------------------------------------------------------------

name: "Dependency Review"

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always
          # Deny specific licenses if needed:
          # deny-licenses: GPL-3.0, AGPL-3.0
